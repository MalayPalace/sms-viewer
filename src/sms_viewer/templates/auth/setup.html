{% extends "base.html" %}

{% block title %}Setup - SMS Viewer{% endblock %}

{% block navbar %}
<!-- Hide navbar on auth pages -->
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-fade-in-up">
        <div class="auth-logo">
            <span class="auth-logo__icon">👋</span>
            <h1 class="auth-logo__title">Welcome to SMS Viewer</h1>
            <p class="auth-logo__subtitle">Create an admin account to get started.</p>
        </div>
        
        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('auth.setup') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Min. 8 characters" minlength="8">
            </div>
            
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="Re-enter password">
            </div>
            
            <div class="mt-24">
                <button type="submit" class="btn btn--primary">Create Account</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
