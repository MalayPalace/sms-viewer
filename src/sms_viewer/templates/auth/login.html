{% extends "base.html" %}

{% block title %}Login - SMS Viewer{% endblock %}

{% block navbar %}
<!-- Hide navbar on auth pages -->
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-fade-in-up">
        <div class="auth-logo">
            <span class="auth-logo__icon">💬</span>
            <h1 class="auth-logo__title">SMS Viewer</h1>
            <p class="auth-logo__subtitle">Welcome back</p>
        </div>
        
        {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="Enter your password">
            </div>
            
            <div class="mt-24">
                <button type="submit" class="btn btn--primary">Log In</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
