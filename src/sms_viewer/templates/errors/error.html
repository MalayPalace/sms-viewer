{% extends "base.html" %}

{% block title %}{{ code }} - SMS Viewer{% endblock %}

{% block navbar_title %}SMS Viewer{% endblock %}

{% block content %}
<div class="page-container">
    <div class="card card--padded text-center">
        <h2 class="page-title">{{ code }} &middot; {{ title }}</h2>
        <p class="text-muted mb-16">{{ message }}</p>
        <a href="{{ url_for('views.threads') }}" class="btn btn--primary" style="display: inline-flex; width: auto;">Back to conversations</a>
    </div>
</div>
{% endblock %}
