<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SMS Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page-container" style="padding-top: 20vh;">
        <div class="card card--padded text-center">
            <h1 class="page-title">You are offline</h1>
            <p class="text-muted mb-16">SMS Viewer can't reach its server. Make sure it is running, then try again. Your messages are never stored in the browser.</p>
            <button type="button" class="btn btn--primary" style="width: auto;" onclick="location.reload()">Retry</button>
        </div>
    </main>
</body>
</html>
